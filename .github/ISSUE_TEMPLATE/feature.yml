name: Feature request
description: Propose a new feature or API.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Walk us through it.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what's painful about how kita handles this?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like it to work? Sketches, API shapes, examples all welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried working around this? What didn't fit?

  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: Does another library handle this well? Pinia, Ember Data, TanStack Query, etc.
